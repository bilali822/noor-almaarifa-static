<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>نور المعرفة - القرآن الكريم</title>
<meta name="theme-color" content="#0A0A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نور المعرفة">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════
   ✨ نور المعرفة — تصميم عصري 2025
   ═══════════════════════════════════════════════════ */

:root {
  --primary: #6C63FF;
  --primary-dark: #5A4FCF;
  --primary-light: #8B83FF;
  --accent: #FF6B9D;
  --accent-2: #FFD93D;
  --accent-3: #00D2FF;
  
  --bg-deep: #0A0A1A;
  --bg-mid: #12122E;
  --bg-soft: #1A1A3E;
  --surface: rgba(255, 255, 255, 0.04);
  --surface-hover: rgba(255, 255, 255, 0.08);
  --surface-active: rgba(108, 99, 255, 0.15);
  
  --text: #FFFFFF;
  --text-soft: rgba(255, 255, 255, 0.75);
  --text-muted: rgba(255, 255, 255, 0.45);
  
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(108, 99, 255, 0.4);
  
  --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.3);
  --shadow-glow: 0 0 40px rgba(108, 99, 255, 0.3);
  
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  
  --font: 'Tajawal', system-ui, -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font);
  background: var(--bg-deep);
  color: var(--text);
  direction: rtl;
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ═══════════════════════════════════════════════════
   🌌 خلفية متحركة فاخرة
   ═══════════════════════════════════════════════════ */
.bg-scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: 
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(108, 99, 255, 0.25), transparent 60%),
    radial-gradient(ellipse 80% 60% at 80% 100%, rgba(255, 107, 157, 0.15), transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 50%, rgba(0, 210, 255, 0.08), transparent 60%),
    linear-gradient(180deg, var(--bg-deep), var(--bg-mid));
}

.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  animation: orbFloat 20s infinite ease-in-out;
}

.bg-orb:nth-child(1) {
  width: 400px;
  height: 400px;
  background: var(--primary);
  top: -100px;
  left: -100px;
  animation-duration: 25s;
}

.bg-orb:nth-child(2) {
  width: 350px;
  height: 350px;
  background: var(--accent);
  bottom: -80px;
  right: -80px;
  animation-duration: 22s;
  animation-delay: -5s;
}

@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(50px, -40px) scale(1.1); }
  66% { transform: translate(-40px, 50px) scale(0.9); }
}

/* ═══════════════════════════════════════════════════
   🏛️ الهيدر
   ═══════════════════════════════════════════════════ */
.header {
  position: relative;
  z-index: 10;
  background: rgba(18, 18, 46, 0.6);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.header .brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header .brand .back-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}

.header .brand .back-btn:hover {
  background: var(--primary);
  border-color: var(--primary);
  transform: scale(1.08) rotate(180deg);
  box-shadow: var(--shadow-glow);
}

.header .brand .icon-wrapper {
  width: 46px;
  height: 46px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 6px 24px rgba(108, 99, 255, 0.4);
  position: relative;
}

.header .brand .icon-wrapper::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary), var(--accent));
  z-index: -1;
  opacity: 0.5;
  filter: blur(8px);
}

.header .brand .info h2 {
  font-size: 17px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--text), var(--primary-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}

.header .brand .info .status {
  font-size: 11.5px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 2px;
}

.header .brand .info .status::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #4ADE80;
  box-shadow: 0 0 8px #4ADE80;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.header-actions {
  display: flex;
  gap: 8px;
}

.header-actions button {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}

.header-actions button:hover {
  background: var(--primary);
  border-color: var(--primary);
  transform: scale(1.08);
  box-shadow: var(--shadow-glow);
}

/* ═══════════════════════════════════════════════════
   💬 حاوية الشات
   ═══════════════════════════════════════════════════ */
.chat-wrapper {
  position: relative;
  z-index: 1;
  height: calc(100vh - 75px);
  display: flex;
  flex-direction: column;
  max-width: 900px;
  margin: 0 auto;
}

/* ═══════════════════════════════════════════════════
   📜 منطقة الرسائل
   ═══════════════════════════════════════════════════ */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb {
  background: rgba(108, 99, 255, 0.3);
  border-radius: 10px;
}
.messages::-webkit-scrollbar-thumb:hover {
  background: var(--primary);
}

/* ═══════════════════════════════════════════════════
   🌟 شاشة الترحيب
   ═══════════════════════════════════════════════════ */
.welcome {
  text-align: center;
  padding: 30px 10px;
  max-width: 720px;
  margin: 0 auto;
  animation: welcomeIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes welcomeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.welcome .hero {
  width: 100px;
  height: 100px;
  margin: 0 auto 20px;
  border-radius: 30px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  box-shadow: 
    0 20px 60px rgba(108, 99, 255, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
  position: relative;
  animation: heroGlow 3s infinite ease-in-out;
}

.welcome .hero::before {
  content: '';
  position: absolute;
  inset: -20px;
  border-radius: 50px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  filter: blur(30px);
  opacity: 0.5;
  z-index: -1;
}

@keyframes heroGlow {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-6px) scale(1.03); }
}

.welcome h2 {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #FFFFFF, var(--primary-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.welcome .subtitle {
  font-size: 15px;
  color: var(--text-soft);
  margin-bottom: 30px;
  line-height: 1.8;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
}

.welcome .subtitle strong {
  color: var(--accent-2);
  font-weight: 700;
}

/* ═══ بطاقات الميزات ═══ */
.feature-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.feature-card {
  padding: 16px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  text-align: center;
  transition: all 0.3s;
  cursor: default;
}

.feature-card:hover {
  background: var(--surface-hover);
  border-color: var(--border-hover);
  transform: translateY(-4px);
  box-shadow: var(--shadow-glow);
}

.feature-card .icon {
  font-size: 26px;
  margin-bottom: 8px;
  display: block;
}

.feature-card .title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}

.feature-card .desc {
  font-size: 10.5px;
  color: var(--text-muted);
  line-height: 1.4;
}

/* ═══ Quick Actions ═══ */
.quick-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-soft);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: center;
}

.quick-title::before,
.quick-title::after {
  content: '';
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
  flex: 1;
  max-width: 60px;
}

.quick-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.quick-btn {
  padding: 10px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  gap: 6px;
}

.quick-btn:hover {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-color: var(--primary);
  color: var(--white);
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 10px 30px rgba(108, 99, 255, 0.4);
}

.quick-btn:active {
  transform: translateY(-1px) scale(0.98);
}

/* ═══════════════════════════════════════════════════
   💌 الرسائل
   ═══════════════════════════════════════════════════ */
.message {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  max-width: 85%;
  animation: msgIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(15px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.message .avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}

.message.user .avatar {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: var(--white);
}

.message.ai .avatar {
  background: linear-gradient(135deg, var(--accent-2), #FF8A65);
  color: #1a1a2e;
}

.message .bubble {
  padding: 14px 18px;
  border-radius: var(--radius-lg);
  line-height: 1.9;
  font-size: 15px;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  position: relative;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-sm);
}

.message.user .bubble {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: var(--white);
  border-bottom-right-radius: 6px;
}

.message.ai .bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-bottom-left-radius: 6px;
}

.message .bubble pre {
  white-space: pre-wrap;
  font-family: var(--font);
  margin: 0;
  padding: 0;
}

.message .meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  opacity: 0.6;
  margin-top: 8px;
  justify-content: flex-end;
}

.message.ai .meta {
  justify-content: flex-start;
}

.message .copy-btn {
  background: transparent;
  border: 0;
  color: inherit;
  cursor: pointer;
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 6px;
  opacity: 0;
  transition: opacity 0.2s;
}

.message:hover .copy-btn {
  opacity: 1;
}

.message .copy-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}

/* ═══════════════════════════════════════════════════
   ✍️ مؤشر الكتابة
   ═══════════════════════════════════════════════════ */
.typing {
  display: none;
  align-items: flex-start;
  gap: 10px;
  padding: 0 20px;
  align-self: flex-start;
  max-width: 85%;
}

.typing.active { display: flex; }

.typing .avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-2), #FF8A65);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.typing .bubble {
  padding: 14px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  border-bottom-left-radius: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  backdrop-filter: blur(20px);
}

.typing .bubble span {
  font-size: 13px;
  color: var(--text-soft);
  font-weight: 600;
}

.typing .dot {
  width: 7px;
  height: 7px;
  background: var(--primary-light);
  border-radius: 50%;
  animation: bounce 1.4s infinite;
}

.typing .dot:nth-child(2) { animation-delay: 0.2s; }
.typing .dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-8px); opacity: 1; }
}

/* ═══════════════════════════════════════════════════
   📝 مربع الكتابة
   ═══════════════════════════════════════════════════ */
.input-area {
  display: flex;
  gap: 10px;
  padding: 16px 20px 20px;
  align-items: flex-end;
  flex-shrink: 0;
}

.input-wrapper {
  flex: 1;
  position: relative;
  display: flex;
  align-items: flex-end;
  background: rgba(18, 18, 46, 0.8);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 4px;
  transition: all 0.3s;
}

.input-wrapper:focus-within {
  border-color: var(--primary);
  box-shadow: 
    0 0 0 4px rgba(108, 99, 255, 0.15),
    0 8px 32px rgba(108, 99, 255, 0.2);
}

.input-area textarea {
  flex: 1;
  padding: 14px 16px;
  border: 0;
  background: transparent;
  font-family: var(--font);
  font-size: 16px;
  resize: none;
  min-height: 48px;
  max-height: 140px;
  color: var(--text);
  line-height: 1.6;
  outline: none;
}

.input-area textarea::placeholder {
  color: var(--text-muted);
}

.input-area .send-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: var(--white);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 6px 24px rgba(108, 99, 255, 0.4);
}

.input-area .send-btn:hover {
  transform: scale(1.08) rotate(15deg);
  box-shadow: 0 10px 40px rgba(108, 99, 255, 0.6);
}

.input-area .send-btn:active {
  transform: scale(0.95);
}

.input-area .send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* ═══════════════════════════════════════════════════
   📱 Responsive
   ═══════════════════════════════════════════════════ */
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .header .brand .info h2 { font-size: 15px; }
  .messages { padding: 18px 14px; gap: 14px; }
  .welcome { padding: 20px 6px; }
  .welcome .hero { width: 80px; height: 80px; font-size: 38px; }
  .welcome h2 { font-size: 22px; }
  .feature-cards { grid-template-columns: repeat(3, 1fr); }
  .message { max-width: 92%; }
  .message .bubble { padding: 12px 15px; font-size: 14.5px; }
  .message .avatar { width: 34px; height: 34px; font-size: 16px; }
  .input-area { padding: 12px 14px 16px; }
  .input-area .send-btn { width: 48px; height: 48px; }
}

@media (max-width: 480px) {
  .header .brand .info h2 { font-size: 14px; }
  .header .brand .icon-wrapper { width: 40px; height: 40px; font-size: 18px; }
  .header .brand .back-btn { width: 38px; height: 38px; }
  .header-actions button { width: 38px; height: 38px; }
  
  .feature-cards { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .feature-card { padding: 12px 8px; }
  .feature-card .icon { font-size: 22px; }
  .feature-card .title { font-size: 11px; }
  .feature-card .desc { display: none; }
  
  .quick-btn { padding: 8px 14px; font-size: 12px; }
  .message .bubble { font-size: 14px; }
}

/* ═══ توفير الأداء */
@media (max-width: 1024px), (prefers-reduced-motion: reduce) {
  .bg-orb { animation: none; }
  .welcome .hero { animation: none; }
  .welcome .hero::before { display: none; }
}
</style>

<style>
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 26, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 16px;
    animation: fadeIn 0.3s ease;
}

.overlay.active { display: flex; }

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.tafsir-popup {
    background: rgba(18, 18, 46, 0.95);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    max-width: 640px;
    width: 100%;
    max-height: 85vh;
    padding: 26px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
    overflow-y: auto;
    animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes slideUp {
    from { transform: translateY(40px) scale(0.95); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
}

.popup-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
}

.popup-header h3 {
    font-size: 19px;
    font-weight: 800;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
}

.popup-close {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
