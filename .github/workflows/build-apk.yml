name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 📦 Install npm packages
        run: npm install
      
      - name: 📱 Add Android platform
        run: npx cap add android
      
      - name: 🔄 Sync Android
        run: npx cap sync android
      
      - name: 🎨 Configure Fullscreen Mode
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|android:theme="@style/AppTheme"|android:theme="@style/AppTheme.NoActionBar"|g' "$MANIFEST" || true
          fi
      
      - name: 🔨 Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-almaarifa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      
      - name: 📊 APK Info
        run: |
          echo "═══ APK Files ═══"
          find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
