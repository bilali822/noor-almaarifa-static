<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>نور المعرفة - القرآن الكريم</title>
<meta name="theme-color" content="#0A0A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نور المعرفة">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════
   ✨ نور المعرفة — تصميم عصري 2025
   ═══════════════════════════════════════════════════ */

:root {
  --primary: #6C63FF;
  --primary-dark: #5A4FCF;
  --primary-light: #8B83FF;
  --accent: #FF6B9D;
  --accent-2: #FFD93D;
  --accent-3: #00D2FF;
  
  --bg-deep: #0A0A1A;
  --bg-mid: #12122E;
  --bg-soft: #1A1A3E;
  --surface: rgba(255, 255, 255, 0.04);
  --surface-hover: rgba(255, 255, 255, 0.08);
  --surface-active: rgba(108, 99, 255, 0.15);
  
  --text: #FFFFFF;
  --text-soft: rgba(255, 255, 255, 0.75);
  --text-muted: rgba(255, 255, 255, 0.45);
  
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(108, 99, 255, 0.4);
  
  --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.3);
  --shadow-glow: 0 0 40px rgba(108, 99, 255, 0.3);
  
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  
  --font: 'Tajawal', system-ui, -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font);
  background: var(--bg-deep);
  color: var(--text);
  direction: rtl;
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ═══════════════════════════════════════════════════
   🌌 خلفية متحركة فاخرة
   ═══════════════════════════════════════════════════ */
.bg-scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: 
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(108, 99, 255, 0.25), transparent 60%),
    radial-gradient(ellipse 80% 60% at 80% 100%, rgba(255, 107, 157, 0.15), transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 50%, rgba(0, 210, 255, 0.08), transparent 60%),
    linear-gradient(180deg, var(--bg-deep), var(--bg-mid));
}

.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  animation: orbFloat 20s infinite ease-in-out;
}

.bg-orb:nth-child(1) {
  width: 400px;
  height: 400px;
  background: var(--primary);
  top: -100px;
  left: -100px;
  animation-duration: 25s;
}

.bg-orb:nth-child(2) {
  width: 350px;
  height: 350px;
  background: var(--accent);
  bottom: -80px;
  right: -80px;
  animation-duration: 22s;
  animation-delay: -5s;
}

@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(50px, -40px) scale(1.1); }
  66% { transform: translate(-40px, 50px) scale(0.9); }
}

/* ═══════════════════════════════════════════════════
   🏛️ الهيدر
   ═══════════════════════════════════════════════════ */
.header {
  position: relative;
  z-index: 10;
  background: rgba(18, 18, 46, 0.6);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.header .brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header .brand .back-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}

.header .brand .back-btn:hover {
  background: var(--primary);
  border-color: var(--primary);
  transform: scale(1.08) rotate(180deg);
  box-shadow: var(--shadow-glow);
}

.header .brand .icon-wrapper {
  width: 46px;
  height: 46px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 6px 24px rgba(108, 99, 255, 0.4);
  position: relative;
}

.header .brand .icon-wrapper::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary), var(--accent));
  z-index: -1;
  opacity: 0.5;
  filter: blur(8px);
}

.header .brand .info h2 {
  font-size: 17px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--text), var(--primary-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}

.header .brand .info .status {
  font-size: 11.5px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 2px;
}

.header .brand .info .status::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #4ADE80;
  box-shadow: 0 0 8px #4ADE80;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.header-actions {
  display: flex;
  gap: 8px;
}

.header-actions button {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}

.header-actions button:hover {
  background: var(--primary);
  border-color: var(--primary);
  transform: scale(1.08);
  box-shadow: var(--shadow-glow);
}

/* ═══════════════════════════════════════════════════
   💬 حاوية الشات
   ═══════════════════════════════════════════════════ */
.chat-wrapper {
  position: relative;
  z-index: 1;
  height: calc(100vh - 75px);
  display: flex;
  flex-direction: column;
  max-width: 900px;
  margin: 0 auto;
}

/* ═══════════════════════════════════════════════════
   📜 منطقة الرسائل
   ═══════════════════════════════════════════════════ */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb {
  background: rgba(108, 99, 255, 0.3);
  border-radius: 10px;
}
.messages::-webkit-scrollbar-thumb:hover {
  background: var(--primary);
}

/* ═══════════════════════════════════════════════════
   🌟 شاشة الترحيب
   ═══════════════════════════════════════════════════ */
.welcome {
  text-align: center;
  padding: 30px 10px;
  max-width: 720px;
  margin: 0 auto;
  animation: welcomeIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes welcomeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.welcome .hero {
  width: 100px;
  height: 100px;
  margin: 0 auto 20px;
  border-radius: 30px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  box-shadow: 
    0 20px 60px rgba(108, 99, 255, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
  position: relative;
  animation: heroGlow 3s infinite ease-in-out;
}

.welcome .hero::before {
  content: '';
  position: absolute;
  inset: -20px;
  border-radius: 50px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  filter: blur(30px);
  opacity: 0.5;
  z-index: -1;
}

@keyframes heroGlow {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-6px) scale(1.03); }
}

.welcome h2 {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #FFFFFF, var(--primary-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.welcome .subtitle {
  font-size: 15px;
  color: var(--text-soft);
  margin-bottom: 30px;
  line-height: 1.8;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
}

.welcome .subtitle strong {
  color: var(--accent-2);
  font-weight: 700;
}

/* ═══ بطاقات الميزات ═══ */
.feature-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.feature-card {
  padding: 16px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  text-align: center;
  transition: all 0.3s;
  cursor: default;
}

.feature-card:hover {
  background: var(--surface-hover);
  border-color: var(--border-hover);
  transform: translateY(-4px);
  box-shadow: var(--shadow-glow);
}

.feature-card .icon {
  font-size: 26px;
  margin-bottom: 8px;
  display: block;
}

.feature-card .title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}

.feature-card .desc {
  font-size: 10.5px;
  color: var(--text-muted);
  line-height: 1.4;
}

/* ═══ Quick Actions ═══ */
.quick-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-soft);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: center;
}

.quick-title::before,
.quick-title::after {
  content: '';
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
  flex: 1;
  max-width: 60px;
}

.quick-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.quick-btn {
  padding: 10px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  gap: 6px;
}

.quick-btn:hover {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-color: var(--primary);
  color: var(--white);
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 10px 30px rgba(108, 99, 255, 0.4);
}

.quick-btn:active {
  transform: translateY(-1px) scale(0.98);
}

/* ═══════════════════════════════════════════════════
   💌 الرسائل
   ═══════════════════════════════════════════════════ */
.message {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  max-width: 85%;
  animation: msgIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(15px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.message .avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}

.message.user .avatar {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: var(--white);
}

.message.ai .avatar {
  background: linear-gradient(135deg, var(--accent-2), #FF8A65);
  color: #1a1a2e;
}

.message .bubble {
  padding: 14px 18px;
  border-radius: var(--radius-lg);
  line-height: 1.9;
  font-size: 15px;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  position: relative;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-sm);
}

.message.user .bubble {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: var(--white);
  border-bottom-right-radius: 6px;
}

.message.ai .bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-bottom-left-radius: 6px;
}

.message .bubble pre {
  white-space: pre-wrap;
  font-family: var(--font);
  margin: 0;
  padding: 0;
}

.message .meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  opacity: 0.6;
  margin-top: 8px;
  justify-content: flex-end;
}

.message.ai .meta {
  justify-content: flex-start;
}

.message .copy-btn {
  background: transparent;
  border: 0;
  color: inherit;
  cursor: pointer;
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 6px;
  opacity: 0;
  transition: opacity 0.2s;
}

.message:hover .copy-btn {
  opacity: 1;
}

.message .copy-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}

/* ═══════════════════════════════════════════════════
   ✍️ مؤشر الكتابة
   ═══════════════════════════════════════════════════ */
.typing {
  display: none;
  align-items: flex-start;
  gap: 10px;
  padding: 0 20px;
  align-self: flex-start;
  max-width: 85%;
}

.typing.active { display: flex; }

.typing .avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-2), #FF8A65);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.typing .bubble {
  padding: 14px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  border-bottom-left-radius: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  backdrop-filter: blur(20px);
}

.typing .bubble span {
  font-size: 13px;
  color: var(--text-soft);
  font-weight: 600;
}

.typing .dot {
  width: 7px;
  height: 7px;
  background: var(--primary-light);
  border-radius: 50%;
  animation: bounce 1.4s infinite;
}

.typing .dot:nth-child(2) { animation-delay: 0.2s; }
.typing .dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-8px); opacity: 1; }
}

/* ═══════════════════════════════════════════════════
   📝 مربع الكتابة
   ═══════════════════════════════════════════════════ */
.input-area {
  display: flex;
  gap: 10px;
  padding: 16px 20px 20px;
  align-items: flex-end;
  flex-shrink: 0;
}

.input-wrapper {
  flex: 1;
  position: relative;
  display: flex;
  align-items: flex-end;
  background: rgba(18, 18, 46, 0.8);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 4px;
  transition: all 0.3s;
}

.input-wrapper:focus-within {
  border-color: var(--primary);
  box-shadow: 
    0 0 0 4px rgba(108, 99, 255, 0.15),
    0 8px 32px rgba(108, 99, 255, 0.2);
}

.input-area textarea {
  flex: 1;
  padding: 14px 16px;
  border: 0;
  background: transparent;
  font-family: var(--font);
  font-size: 16px;
  resize: none;
  min-height: 48px;
  max-height: 140px;
  color: var(--text);
  line-height: 1.6;
  outline: none;
}

.input-area textarea::placeholder {
  color: var(--text-muted);
}

.input-area .send-btn {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: var(--white);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 6px 24px rgba(108, 99, 255, 0.4);
}

.input-area .send-btn:hover {
  transform: scale(1.08) rotate(15deg);
  box-shadow: 0 10px 40px rgba(108, 99, 255, 0.6);
}

.input-area .send-btn:active {
  transform: scale(0.95);
}

.input-area .send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* ═══════════════════════════════════════════════════
   📱 Responsive
   ═══════════════════════════════════════════════════ */
@media (max-width: 768px) {
  .header { padding: 12px 16px; }
  .header .brand .info h2 { font-size: 15px; }
  .messages { padding: 18px 14px; gap: 14px; }
  .welcome { padding: 20px 6px; }
  .welcome .hero { width: 80px; height: 80px; font-size: 38px; }
  .welcome h2 { font-size: 22px; }
  .feature-cards { grid-template-columns: repeat(3, 1fr); }
  .message { max-width: 92%; }
  .message .bubble { padding: 12px 15px; font-size: 14.5px; }
  .message .avatar { width: 34px; height: 34px; font-size: 16px; }
  .input-area { padding: 12px 14px 16px; }
  .input-area .send-btn { width: 48px; height: 48px; }
}

@media (max-width: 480px) {
  .header .brand .info h2 { font-size: 14px; }
  .header .brand .icon-wrapper { width: 40px; height: 40px; font-size: 18px; }
  .header .brand .back-btn { width: 38px; height: 38px; }
  .header-actions button { width: 38px; height: 38px; }
  
  .feature-cards { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .feature-card { padding: 12px 8px; }
  .feature-card .icon { font-size: 22px; }
  .feature-card .title { font-size: 11px; }
  .feature-card .desc { display: none; }
  
  .quick-btn { padding: 8px 14px; font-size: 12px; }
  .message .bubble { font-size: 14px; }
}

/* ═══ توفير الأداء */
@media (max-width: 1024px), (prefers-reduced-motion: reduce) {
  .bg-orb { animation: none; }
  .welcome .hero { animation: none; }
  .welcome .hero::before { display: none; }
}
</style>

<style>
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 26, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 16px;
    animation: fadeIn 0.3s ease;
}

.overlay.active { display: flex; }

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.tafsir-popup {
    background: rgba(18, 18, 46, 0.95);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    max-width: 640px;
    width: 100%;
    max-height: 85vh;
    padding: 26px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
    overflow-y: auto;
    animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes slideUp {
    from { transform: translateY(40px) scale(0.95); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
}

.popup-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
}

.popup-header h3 {
    font-size: 19px;
    font-weight: 800;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
}

.popup-close {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;

(function() {
  var isWeakDevice = false;
  
  // 1. عدد أنوية CPU
  if (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) {
    isWeakDevice = true;
  }
  
  // 2. الذاكرة المتاحة
  if (navigator.deviceMemory && navigator.deviceMemory <= 4) {
    isWeakDevice = true;
  }
  
  // 3. نوع الشبكة
  if (navigator.connection) {
    var conn = navigator.connection;
    if (conn.effectiveType === '2g' || conn.effectiveType === 'slow-2g') {
      isWeakDevice = true;
    }
    if (conn.saveData) {
      isWeakDevice = true;
    }
  }
  
  // 4. نوع الجهاز
  if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    isWeakDevice = true;
  }
  
  // 5. الشاشة الصغيرة
  if (window.innerWidth <= 768) {
    isWeakDevice = true;
  }
  
  if (isWeakDevice) {
    document.documentElement.classList.add('weak-device');
    document.body.classList.add('weak-device');
    console.log('⚡ جهاز ضعيف — تم تفعيل وضع التسريع');
  }
})();

    if (sourceEl) sourceEl.textContent = '';
    
    setTimeout(() => {
      splash.classList.add('nm-splash-hide');
      setTimeout(() => splash.remove(), 800);
    }, 800);
  }
  
  // ═══════════════════════════════════════════════════
  // التشغيل
  // ═══════════════════════════════════════════════════
  
  // المحتوى الأول
  const first = content[0];
  if (iconEl) iconEl.textContent = first.icon;
  if (textEl) textEl.textContent = first.text;
  if (sourceEl) sourceEl.textContent = first.source;
  
  // تغيير المحتوى كل 4.5 ثوانٍ
  const speedFactor = (window.innerWidth <= 768 || navigator.hardwareConcurrency <= 4) ? 2000 : 4500;
  const contentTimer = setInterval(changeContent, speedFactor);
  
  // تغيير الحالة كل 2.5 ثانية
  const statusTimer = setInterval(changeStatus, 1500);
  
  // زيادة التقدم
  const progressTimer = setInterval(incrementProgress, 500);
  
  // اخفاء تلقائي عند تحميل الموقع
  function tryHide() {
    if (document.readyState === 'complete') {
      setTimeout(hideSplash, 1000);
    }
  }
  
  if (document.readyState === 'complete') {
    tryHide();
  } else {
    window.addEventListener('load', () => setTimeout(hideSplash, 1000));
  }
  
  // احتياطي — بعد 20 ثانية
  setTimeout(hideSplash, (window.innerWidth <= 768 || navigator.hardwareConcurrency <= 4) ? 5000 : 20000);
  
  // زر التخطي
  if (skipBtn) {
    skipBtn.onclick = () => {
      clearInterval(contentTimer);
      clearInterval(statusTimer);
      clearInterval(progressTimer);
      hideSplash();
    };
  }
  
  console.log('[Splash] ✅ جاهز — محتوى ديني');
})();

<script>
// ============================================================
// نور المعرفة - سكربت الشات الكامل
// ============================================================
// إصلاح CSRF: كل طلبات POST من صفحة القرآن تحمل التوكن الموجود في cookie.
(function installQuranCsrfFetch(){
    if (window.__quranCsrfFetchInstalled) return;
    window.__quranCsrfFetchInstalled = true;
    const nativeFetch = window.fetch.bind(window);
    function getCsrfToken(){
        const match = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : '';
    }
    window.fetch = function(input, init){
        init = init || {};
        const method = String(init.method || 'GET').toUpperCase();
        if (['POST','PUT','PATCH','DELETE'].includes(method)) {
            const headers = new Headers(init.headers || {});
            const token = getCsrfToken();
            if (token) headers.set('X-CSRF-Token', token);
            headers.set('Accept', 'application/json');
            init.headers = headers;
            init.credentials = 'include';
        }
        return nativeFetch(input, init);
    };
})();


// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════
// 📚 أسماء التفاسير الثابتة (بالعربي)
// ═══════════════════════════════════════════════════
window.TAFSIR_ARABIC_NAMES = {
  'muyassar':    { name: 'التفسير الميسر',    icon: '📖' },
  'jalalayn':    { name: 'تفسير الجلالين',    icon: '📕' },
  'ibn_kathir':  { name: 'تفسير ابن كثير',    icon: '📗' },
  'saadi':       { name: 'تفسير السعدي',      icon: '📘' },
  'tabari':      { name: 'تفسير الطبري',      icon: '📙' },
  'qurtubi':     { name: 'تفسير القرطبي',     icon: '📚' },
  'baghawy':     { name: 'تفسير البغوي',      icon: '📓' }
};

// ✅ دالة الحصول على اسم عربي
window.getTafsirArabicName = function(key, fallbackName) {
  if (window.TAFSIR_ARABIC_NAMES[key]) {
    return window.TAFSIR_ARABIC_NAMES[key].name;
  }
  return fallbackName || key;
};

window.getTafsirArabicIcon = function(key, fallbackIcon) {
  if (window.TAFSIR_ARABIC_NAMES[key]) {
    return window.TAFSIR_ARABIC_NAMES[key].icon;
  }
  return fallbackIcon || '📖';
};

// 💡 Tafsir Fallback Helpers
// يعمل مع الإنترنت (fetch من data/) وبدونها (IndexedDB)
// ═══════════════════════════════════════════════════
window.__tafsirCache = window.__tafsirCache || {};

// اجلب تفسير كامل من الخادم (أو من الكاش)
window.fetchTafsirBook = async function(bookKey) {
    // 1. من الذاكرة
    if (window.__tafsirCache[bookKey]) {
        return window.__tafsirCache[bookKey];
    }
    // 2. من IndexedDB
    try {
        var cached = await window.NoorDB.get('tafsirs', bookKey);
        if (cached && cached.content) {
            window.__tafsirCache[bookKey] = cached.content;
            return cached.content;
        }
    } catch(e) {}
    // 3. من الخادم
    try {
        var res = await fetch('./data/tafsirs/' + bookKey + '.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var content = await res.json();
        window.__tafsirCache[bookKey] = content;
        // خزّن في IndexedDB للاستخدام offline
        try {
            var db = await window.NoorDB.open();
            var tx = db.transaction('tafsirs', 'readwrite');
            tx.objectStore('tafsirs').put({ key: bookKey, content: content });
            await new Promise(function(r) { tx.oncomplete = r; });
        } catch(e) {}
        return content;
    } catch(e) {
        console.warn('[Tafsir] فشل تحميل', bookKey, ':', e.message);
        return null;
    }
};

// اجلب نص تفسير لآية معينة (مع Fallback)
window.getTafsirText = async function(bookKey, surahId, verseNumber) {
    try {
        // 1. من IndexedDB أولاً
        var cached = await window.NoorDB.getTafsir(bookKey, surahId, verseNumber);
        if (cached && !cached.startsWith('⚠️')) {
            return cached;
        }
        // 2. Fallback: من الخادم
        var content = await window.fetchTafsirBook(bookKey);
        if (!content) return '⚠️ غير متوفر';
        var surah = content[String(surahId)];
        if (!surah) return '⚠️ غير متوفر';
        var text = surah[String(verseNumber)];
        return text || '⚠️ غير متوفر';
    } catch(e) {
        return '⚠️ غير متوفر';
    }
};

// احصل على كل التفاسير لآية (مع Fallback)
window.getAllTafsirsWithFallback = async function(surahId, verseNumber) {
    // احصل على الفهرس
    var books = [];
    try {
        books = await window.NoorDB.getTafsirBooks();
    } catch(e) {}
    
    if (!books || books.length === 0) {
        try {
            var idx = await fetch('./data/tafsirs_index.json').then(function(r) { return r.json(); });
            books = idx.books || [];
        } catch(e) {
            return [];
        }
    }
    
    // اجلب كل التفاسير بالتوازي
    var results = await Promise.all(books.map(async function(book) {
        var text = await window.getTafsirText(book.key, surahId, verseNumber);
        return Object.assign({}, book, { text: text });
    }));
    
    return results;
};

function toggleTafsir(key) {
    if (selectedTafsirs.has(key)) selectedTafsirs.delete(key);
    else selectedTafsirs.add(key);
    updateUI();
}

function selectAllTafsirs() {
    var allKeys = document.querySelectorAll('.tafsir-option:not([style*="opacity: 0.5"])');
    var btn = document.getElementById('btnAllTafsirs');

        selectedTafsirs = new Set();

function updateUI() {
    document.querySelectorAll('.tafsir-option').forEach(function(el){
        el.classList.toggle('selected', selectedTafsirs.has(el.dataset.key));

        alert('⚠️ اختر تفسيراً واحداً على الأقل');
        return;
    }
    
    var btn = document.getElementById('btnShowTafsir');

        var selected = Array.from(selectedTafsirs);
        var verses = (currentVerseInfo.verses && currentVerseInfo.verses.length)
            ? currentVerseInfo.verses
            : [currentVerseInfo];
        
        // ═══════════════════════════════════════════
        // 🚀 1. عرض رسالة فورية
        // ═══════════════════════════════════════════

        // ═══════════════════════════════════════════

        // ═══════════════════════════════════════════

        // ═══════════════════════════════════════════
        var parts = [];
        parts.push(headerText);
        parts.push('');
        parts.push('═══════════════════════════════');
        parts.push('');
        
        for (var i = 0; i < verses.length; i++) {
            var v = verses[i];
            var sid = v.surah_id || currentVerseInfo.surah_id;
            var vn = v.verse_number;
            var sn = v.surah_name || currentVerseInfo.surah_name;
            var vt = v.verse_text || '';
            
            if (verses.length > 1) {
                parts.push('🔸 الآية ' + vn + ':');
            }
            parts.push('');
            parts.push('﴿ ' + vt + ' ﴾');
            parts.push('');
            
            for (var j = 0; j < selected.length; j++) {
                var key = selected[j];
                var book = await window.NoorDB.getTafsirBook(key);
                
                // ✅ استخدم الاسم العربي الثابت
                var bookName = window.getTafsirArabicName(key, book ? (book.name || book.short_name) : null);
                var bookIcon = window.getTafsirArabicIcon(key, book ? book.icon : null);
                
                var tafsirText = '⚠️ غير متوفر';
                var content = loadedBooks[key];
                if (content && content[String(sid)] && content[String(sid)][String(vn)]) {
                    tafsirText = content[String(sid)][String(vn)];
                }
                
                if (tafsirText && !tafsirText.startsWith('⚠️')) {
                    parts.push('─────────────────');
                    parts.push(bookIcon + ' ' + bookName + ':');
                    parts.push('');
                    parts.push(tafsirText);
                    parts.push('');
                } else {
                    parts.push('─────────────────');
                    parts.push(bookIcon + ' ' + bookName + ': ⚠️ غير متوفر');
                    parts.push('');
                }
            }
            
            if (verses.length > 1 && i < verses.length - 1) {
                parts.push('');
                parts.push('═══════════════════════════════');
                parts.push('');
            }
        }
        
        parts.push('');
        parts.push('─────────────────────────────');
        parts.push('📚 المصدر: كتب التفسير المعتمدة عند أهل السنة والجماعة');
        
        var finalMessage = parts.join('\n');
        
        // ═══════════════════════════════════════════
        // 🚀 4. استبدل الرسالة المؤقتة
        // ═══════════════════════════════════════════
        replaceMessage(tempId, finalMessage);
        
    } catch(err) {
        console.error('showSelectedTafsirs error:', err);
        alert('❌ خطأ: ' + err.message);
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '✅ عرض التفسير'; }
    }
}// ✅ إضافة رسالة مع ID (للاستبدال)
function addMessageWithId(text, type, id) {
    var container = document.getElementById('messages');
    var welcome = document.getElementById('welcome');
    if (welcome) welcome.style.display = 'none';
    if (!container) return;
    
    var div = document.createElement('div');
    div.className = 'message ' + type;
    div.id = id;
    
    var time = new Date().toLocaleTimeString('ar-SA', {hour: '2-digit', minute: '2-digit'});
    var pre = document.createElement('pre');
    pre.textContent = String(text || '');
    var timeEl = document.createElement('span');
    timeEl.className = 'time';
    timeEl.textContent = time;
    div.appendChild(pre);
    div.appendChild(timeEl);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

// ✅ استبدال رسالة موجودة
function replaceMessage(id, newText) {
    var existing = document.getElementById(id);
    if (!existing) {
        // إذا لم توجد، أضف رسالة جديدة
        addMessage(newText, 'ai');
        return;
    }
    var pre = existing.querySelector('pre');
    if (pre) pre.textContent = newText;
    
    // تمرير لأسفل
    var container = document.getElementById('messages');
    if (container) container.scrollTop = container.scrollHeight;
}// ---------- إرسال الرسائل ----------
async function sendMessage() {
    var input = document.getElementById('input');
    if (!input) return;
    var text = input.value.trim();
    if (!text || isProcessing) return;
    
    addMessage(text, 'user');
    input.value = '';
    isProcessing = true;
    
    var btn = document.getElementById('sendBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
    showTyping(true);

    try {
        if (!window.QuranSearchEngine) {
            throw new Error('محرك البحث غير جاهز');
        }
        
        var result = await window.QuranSearchEngine.search(text, window.NoorDB);
        
        showTyping(false);
        
        if (!result) {
            addMessage('❌ لم أجد نتيجة', 'ai');
            return;
        }
        
        // ═══ آية محددة → افتح النافذة فقط (بدون رسالة) ═══
        if (result.success && result.type === 'verse') {
            try { localStorage.setItem('lastRead', JSON.stringify(result.data)); } catch(e){}
            try {
                await openPopup(result.data, result.data.tafsir_books || []);
            } catch(popupErr) {
                console.warn('openPopup error:', popupErr);
                addMessage('⚠️ تعذر فتح نافذة التفسير: ' + popupErr.message, 'ai');
            }
        }
        // ═══ سورة كاملة → اعرض السورة فقط ═══
        else if (result.success && result.type === 'surah') {
            var verses = result.data.verses || [];
            var msg = '📖 سورة ' + result.data.surah_name + '\n';
            msg += '📊 عدد الآيات: ' + result.data.verse_count + '\n';
            msg += '─────────────────────\n\n';
            verses.slice(0, 20).forEach(function(v) {
                msg += v.verse_number + '. ﴿ ' + v.verse_text + ' ﴾\n\n';
            });
            if (verses.length > 20) msg += '\n... و ' + (verses.length - 20) + ' آية أخرى';
            addMessage(msg, 'ai');
            
            if (verses.length > 0) {
                try {
                    await openPopup(result.data, result.data.tafsir_books || []);
                } catch(e) {}
            }
        }
        // ═══ نطاق آيات ═══
        else if (result.success && result.type === 'range') {
            var verses2 = result.data.verses || [];
            var msg2 = '📖 سورة ' + result.data.surah_name + '\n';
            msg2 += '📊 الآيات: ' + result.data.start_verse + ' - ' + result.data.end_verse + '\n';
            msg2 += '─────────────────────\n\n';
            verses2.forEach(function(v){ msg2 += v.verse_number + '. ﴿ ' + v.verse_text + ' ﴾\n\n'; });
            addMessage(msg2, 'ai');
            
            if (verses2.length > 0) {
                try {
                    await openPopup(result.data, result.data.tafsir_books || []);
                } catch(e) {}
            }
        }
        // ═══ بحث ═══
        else if (result.success && result.type === 'search') {
            var results = result.data && result.data.results ? result.data.results : [];
            var msg3 = '🔍 نتائج البحث (' + results.length + '):\n';
            msg3 += '─────────────────────\n\n';
            results.slice(0, 10).forEach(function(r, i) {
                msg3 += (i+1) + '. ' + (r.surah_name || '') + ' ' + (r.verse_number || '') + ': ﴿ ' + (r.verse_text || '').substring(0, 100) + '... ﴾\n\n';
            });
            addMessage(msg3, 'ai');
        }
        // ═══ رد عام ═══
        else {
            addMessage(result.reply || '❌ لم أجد نتيجة', 'ai');
        }
        
    } catch(err) {
        showTyping(false);
        console.error('[Chat] خطأ:', err);
        addMessage('❌ ' + err.message, 'ai');
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'إرسال ➤'; }
        if (input) input.focus();
        isProcessing = false;
    }
}// ---------- الميزات الأخرى ----------
async function openSurahIndex() {
    var overlay = document.getElementById('surahOverlay');
    if (overlay) overlay.classList.add('active');
    var grid = document.getElementById('surahGrid');
    if (!grid || grid.dataset.loaded === '1') return;
    grid.innerHTML = '<p>⏳ جاري التحميل...</p>';
    try {
        var r = await fetch('./data/surahs.json');
        var d = await r.json();
        if (!d.success) throw new Error(d.error);
        grid.innerHTML = d.surahs.map(function(s){
            return '<button onclick="openSurahById(' + s.id + ')" style="border:1px solid var(--border-color);background:var(--bg-input);padding:12px;border-radius:14px;cursor:pointer;text-align:right;color:var(--text-primary);width:100%;"><strong>' + s.id + '. ' + s.name_ar + '</strong><br><small style="color:var(--text-secondary);font-size:11px;">' + s.verses_count + ' آية</small></button>';
        }).join('');
        grid.dataset.loaded = '1';
    } catch(e) {
        grid.innerHTML = '<p>❌ تعذر التحميل</p>';
    }

function filterSurahs() {
    var q = (document.getElementById('surahFilter') || {}).value || '';
    q = q.trim().toLowerCase();
    document.querySelectorAll('#surahGrid .surah-card, #surahGrid button').forEach(function(el){
        var name = (el.dataset.name || el.textContent || '').toLowerCase();
        el.style.display = name.includes(q) ? 'block' : 'none';
    });
}

function openSurahById(id) {
    var overlay = document.getElementById('surahOverlay');
    if (overlay) overlay.classList.remove('active');
    var inp = document.getElementById('input');
    if (inp) inp.value = String(id);
    sendMessage();
}

function openQuranSearch(){
    var inp = document.getElementById('input');

    inp.value = '';
    inp.placeholder = 'اكتب اسم السورة أو رقم الآية أو كلمة للبحث...';

async function loadRandomVerse(daily) {
    try {
        var r = await fetch('/api/verse/random?daily=' + (daily ? 1 : 0));
        var d = await r.json();
        if (!d.success) throw new Error(d.error);
        showVerseFeature(d.verse);
    } catch(e) {
        addMessage('❌ تعذر تحميل الآية', 'ai');
    }
}

async function showVerseFeature(v) {
    try { localStorage.setItem('lastRead', JSON.stringify(v)); } catch(e){}
    currentVerseInfo = {surah_name: v.surah_name, surah_id: v.surah_id, verse_number: v.verse_number, verse_text: v.verse_text};
    addMessage('📖 سورة ' + v.surah_name + ' — الآية ' + v.verse_number + '\n\n﴿ ' + v.verse_text + ' ﴾', 'ai');
    
    try {
        var r = await fetch('./data/tafsirs_index.json');
        var d = await r.json();
        openPopup(currentVerseInfo, d.books || []);
    } catch(e) {
        console.warn('showVerseFeature error:', e);
    }
}

function saveCurrentVerse() {
    if (!currentVerseInfo) return;
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem('quranFavorites') || '[]'); } catch(e){}
    var item = {surah_id: currentVerseInfo.surah_id, surah_name: currentVerseInfo.surah_name, verse_number: currentVerseInfo.verse_number, verse_text: currentVerseInfo.verse_text};
    var exists = arr.some(function(x){ return x.surah_id === item.surah_id && x.verse_number === item.verse_number; });
    if (!exists) {
        arr.unshift(item);
        arr = arr.slice(0, 100);
        try { localStorage.setItem('quranFavorites', JSON.stringify(arr)); } catch(e){}
        alert('⭐ تم حفظ الآية');
    } else {
        alert('⭐ محفوظة مسبقاً');
    }
}

function openFavorites() {
    var list = document.getElementById('favoritesList');
    if (!list) return;
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem('quranFavorites') || '[]'); } catch(e){}
    if (arr.length === 0) {
        list.innerHTML = '<p>لا توجد آيات محفوظة.</p>';
    } else {
        list.innerHTML = arr.map(function(v, i){
            return '<div style="padding:16px;border:1px solid var(--border-color);border-radius:16px;background:var(--bg-input);margin-bottom:9px;"><strong style="display:block;margin-bottom:7px;color:var(--primary);">📖 سورة ' + v.surah_name + ' — ' + v.verse_number + '</strong><div style="line-height:2;font-size:15px;">﴿ ' + v.verse_text + ' ﴾</div><button onclick="openFavorite(' + i + ')" style="margin-top:10px;margin-left:6px;border:1px solid var(--border-color);background:rgba(108,99,255,.08);color:var(--text-primary);border-radius:10px;padding:7px 12px;cursor:pointer;">عرض</button><button onclick="removeFavorite(' + i + ')" style="margin-top:10px;margin-left:6px;border:1px solid var(--border-color);background:rgba(108,99,255,.08);color:var(--text-primary);border-radius:10px;padding:7px 12px;cursor:pointer;">حذف</button></div>';
        }).join('');
    }
    var overlay = document.getElementById('favoritesOverlay');
    if (overlay) overlay.classList.add('active');
}

function openFavorite(i) {
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem('quranFavorites') || '[]'); } catch(e){}
    var v = arr[i];
    if (!v) return;
    var overlay = document.getElementById('favoritesOverlay');
    if (overlay) overlay.classList.remove('active');
    showVerseFeature(v);
}

function removeFavorite(i) {
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem('quranFavorites') || '[]'); } catch(e){}
    arr.splice(i, 1);
    try { localStorage.setItem('quranFavorites', JSON.stringify(arr)); } catch(e){}
    openFavorites();
}

function resumeLastRead() {
    var v = null;
    try { v = JSON.parse(localStorage.getItem('lastRead') || 'null'); } catch(e){}
    if (v) showVerseFeature(v);
    else alert('ℹ️ لا توجد قراءة سابقة');
}

function changeFontSize(dir) {
    document.body.classList.remove('font-large', 'font-xl');
    var n = parseInt(localStorage.getItem('quranFont') || '0') + dir;
    n = Math.max(0, Math.min(2, n));
    if (n === 1) document.body.classList.add('font-large');
    if (n === 2) document.body.classList.add('font-xl');
    try { localStorage.setItem('quranFont', String(n)); } catch(e){}
}

function loadFontSize() {
    var n = parseInt(localStorage.getItem('quranFont') || '0');
    if (n === 1) document.body.classList.add('font-large');
    if (n === 2) document.body.classList.add('font-xl');
}

async function copyCurrentVerse() {
    if (!currentVerseInfo) return;
    try {
        await navigator.clipboard.writeText('سورة ' + currentVerseInfo.surah_name + ' — الآية ' + currentVerseInfo.verse_number + '\n﴿ ' + currentVerseInfo.verse_text + ' ﴾');
        alert('📋 تم النسخ');
    } catch(e) { alert('❌ تعذر النسخ'); }
}

async function shareCurrentVerse() {
    if (!currentVerseInfo) return;
    var text = 'سورة ' + currentVerseInfo.surah_name + ' — الآية ' + currentVerseInfo.verse_number + '\n﴿ ' + currentVerseInfo.verse_text + ' ﴾';
    try {
        if (navigator.share) await navigator.share({title: 'آية', text: text});
        else { await navigator.clipboard.writeText(text); alert('📋 تم نسخ النص'); }
    } catch(e){}
}

function showCurrentSurah() {
    if (!currentVerseInfo) return;
    var name = currentVerseInfo.surah_name;
    closePopup();
    var inp = document.getElementById('input');
    if (inp) inp.value = name;
    sendMessage();

async function showSurahStats() {

    try {

        var d = await r.json();
        if (!d.success) throw new Error(d.error);

async function navigateVerse(delta) {
    if (!currentVerseInfo) return;
    var n = Number(currentVerseInfo.verse_number) + delta;
    try {
        var r = await fetch('/api/verse/' + currentVerseInfo.surah_id + '/' + n);

        if (!d.success) { alert(delta < 0 ? 'هذه أول آية' : 'هذه آخر آية'); return; }

    } catch(e) { alert('❌ تعذر الانتقال'); }
